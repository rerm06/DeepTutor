# Local Postgres alternative to scripts/pg-local.sh. Dev credentials only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["54329:5432"]
    volumes:
      - ./packages/db/bootstrap/roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - ./packages/db/bootstrap/database.sql:/docker-entrypoint-initdb.d/02-database.sql:ro
